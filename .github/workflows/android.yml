name: android

on:
  push:
  pull_request:
  workflow_dispatch:

# Works with GitHub's default read-only GITHUB_TOKEN: checkout needs
# contents:read, upload-artifact needs actions:write. No secrets required
# (debug build; all dependencies are public).
permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build debug APK (HeyTune)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No separate wrapper-validation step: gradle/actions/setup-gradle@v4
      # already validates gradle-wrapper.jar checksums automatically.
      # The old gradle/wrapper-validation-action@v2 is archived and flakes
      # with `connect ETIMEDOUT 104.16.x.x:443` (see gradle/wrapper-validation-action#40).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the legacy "tools" package no
          # longer exists and makes sdkmanager exit 1. Our Install step below
          # fetches everything else explicitly.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          echo "--- available 36/37 platforms ---"
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[67]|build-tools;3[67]" | head -30 || true
          # NOTE: there is no bare `platforms;android-37` package — only
          # `platforms;android-37.0` / 37.1 / 37.2 (see log above). Install 37.0.
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" || ls "$ANDROID_SDK_ROOT/platforms"
          # AGP resolves compileSdk=37 to platforms/android-37. If sdkmanager
          # only laid down android-37.0, link it so the build finds it.
          P="$ANDROID_HOME/platforms"
          [ -d "$P" ] || P="$ANDROID_SDK_ROOT/platforms"
          if [ ! -d "$P/android-37" ] && [ -d "$P/android-37.0" ]; then
            ln -s android-37.0 "$P/android-37"
            echo "Linked android-37 -> android-37.0"
          fi
          ls "$P"

      - name: Fetch Cactus native engine (arm64 only)
        run: |
          pip install cactus-needle
          rm -rf /tmp/eng && needle download "android-arm64" --out /tmp/eng
          mkdir -p "heytune/handsfree/engine/android-arm64"
          cp "$(find /tmp/eng -name libneedle.a | head -1)" "heytune/handsfree/engine/android-arm64/"
          cp "$(find /tmp/eng -name needle.h | head -1)" "heytune/handsfree/engine/android-arm64/"
          find heytune/handsfree/engine -type f

      - name: Verify model URLs reachable
        run: |
          curl -fs -r 0-0 -o /dev/null https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact
          curl -fs -r 0-0 -o /dev/null https://huggingface.co/Cactus-Compute/needle3/resolve/main/needle3.cact

      - name: Make gradlew executable (Windows checkouts lose +x)
        run: chmod +x heytune/gradlew

      - name: Verify staged native engine (must exist before CMake configure)
        run: |
          ls -la heytune/handsfree/engine/android-arm64/
          test -f heytune/handsfree/engine/android-arm64/libneedle.a

      # handsfree unit tests removed from CI to keep debug-APK runs fast
      # (~1m34s saved). Run locally when touching handsfree/:
      #   cd heytune && ./gradlew :handsfree:testDebugUnitTest
      # `assembleCoreDebug` below still compiles all modules, so breakage is caught.

      - name: Assemble debug APK
        working-directory: heytune
        run: ./gradlew :app:assembleCoreDebug --stacktrace

      - name: Verify 16 KB alignment of libneedle_bridge.so
        run: |
          APK=$(ls heytune/app/build/outputs/apk/core/debug/*.apk | head -1)
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -q "$APK" 'lib/arm64-v8a/libneedle_bridge.so' -d /tmp/apkcheck
          OBJDUMP="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          "$OBJDUMP" -p /tmp/apkcheck/lib/arm64-v8a/libneedle_bridge.so | grep LOAD
          if "$OBJDUMP" -p /tmp/apkcheck/lib/arm64-v8a/libneedle_bridge.so | grep LOAD | grep -qv 'align 2\*\*14'; then
            echo "::error::libneedle_bridge.so is NOT 16 KB aligned"
            exit 1
          fi
          echo "libneedle_bridge.so is 16 KB aligned"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HeyTune-debug
          path: heytune/app/build/outputs/apk/core/debug/*.apk
